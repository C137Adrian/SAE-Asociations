[pytest]
# Directorio con tests
testpaths = src/api/tests

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mostrar output más detallado
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personalizados
markers =
    unit: Tests unitarios (sin dependencias externas)
    integration: Tests de integración (con HTTP/BD)
    slow: Tests que tardan más de 1 segundo
    skip: Saltar test temporalmente
    
# Timeout para evitar tests colgados
timeout = 10

# Coverage
[coverage:run]
source = src/api
omit = 
    */tests/*
    */migrations/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
